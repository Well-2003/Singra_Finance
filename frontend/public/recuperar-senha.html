<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F6F1E7">
    <meta name="description" content="Recupere o acesso à sua conta do Singra.">
    <title>Recuperar senha - Singra</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../src/css/global.css">
</head>
<body data-area="site" data-pagina="recuperar-senha">
<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<main id="conteudo" class="tela-centro">
    <div class="cartao cartao-entrada">
        <div class="centro">
            <a class="marca" href="index.html" data-marca></a>
        </div>

        <div data-etapa="pedir">
            <h1 style="margin-top:var(--e3)">Vamos criar uma senha nova</h1>
            <p class="legenda">Diga seu e-mail e a gente manda um link.</p>

            <form data-form-recuperar novalidate style="margin-top:var(--e2)">
                <div class="campo" data-campo="email">
                    <label for="email">Seu e-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email"
                           required autofocus>
                    <span class="aviso-campo" data-erro="email" hidden></span>
                </div>
                <button type="submit" class="botao botao-acao botao-largo">Mandar o link</button>
            </form>

            <p class="centro" style="margin-top:var(--e3)">
                <a href="login.html">Lembrei a senha, quero entrar</a>
            </p>
        </div>

        <div data-etapa="enviado" hidden>
            <h1 style="margin-top:var(--e3)">Confira seu e-mail</h1>
            <p data-texto-enviado></p>

            <!-- Enquanto não houver serviço de e-mail contratado, o link
                 aparece aqui em desenvolvimento. Em producao ele vai
                 apenas para o log do servidor. -->
            <div class="aviso aviso-atencao" data-link-dev hidden></div>

            <a class="botao botao-contorno botao-largo" href="login.html">
                Voltar para entrar
            </a>
        </div>
    </div>
</main>

<script src="../src/js/utils/format.js"></script>
<script src="../src/js/utils/sessao.js"></script>
<script src="../src/js/components/icones.js"></script>
<script src="../src/js/components/navegacao.js"></script>
<script src="../src/js/components/carregando.js"></script>
<script src="../src/js/components/avisos.js"></script>
<script src="../src/js/api/cliente.js"></script>
<script src="../src/js/api/auth.js"></script>
<script src="../src/js/i18n/pt.js"></script>
<script src="../src/js/i18n/en.js"></script>
<script src="../src/js/i18n/es.js"></script>
<script src="../src/js/i18n/idioma.js"></script>
<script src="../src/js/paginas/recuperar-senha.js"></script>
</body>
</html>
