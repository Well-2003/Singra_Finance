<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F6F1E7">
    <meta name="description" content="Crie sua conta gratuita no Singra.">
    <title>Criar conta - Singra</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../src/css/global.css">
</head>
<body data-area="site" data-pagina="cadastro">
<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<main id="conteudo" class="tela-centro">
    <div class="cartao cartao-entrada">
        <div class="centro">
            <a class="marca" href="index.html" data-marca></a>
            <h1 style="margin-top:var(--e2)">Vamos começar</h1>
            <p class="legenda">Leva menos de um minuto. E é de graça.</p>
        </div>

        <form data-form-cadastro novalidate style="margin-top:var(--e3)">
            <div class="campo" data-campo="nome">
                <label for="nome">Como você se chama?</label>
                <input type="text" id="nome" name="nome" autocomplete="name" required autofocus>
                <span class="aviso-campo" data-erro="nome" hidden></span>
            </div>

            <div class="campo" data-campo="email">
                <label for="email">Seu e-mail</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
                <span class="aviso-campo" data-erro="email" hidden></span>
                <span class="dica-campo">Usamos só para você entrar e recuperar a senha.</span>
            </div>

            <div class="campo" data-campo="senha">
                <label for="senha">Crie uma senha</label>
                <!-- Sem campo de confirmação: o botão "mostrar senha"
                     resolve o erro de digitação sem pedir para escrever
                     tudo duas vezes -->
                <input type="password" id="senha" name="senha" data-forca-senha
                       autocomplete="new-password" required minlength="8">

                <div class="forca-senha" data-medidor aria-hidden="true">
                    <span class="forca-marca"></span>
                    <span class="forca-marca"></span>
                    <span class="forca-marca"></span>
                </div>
                <span class="dica-campo" data-texto-forca role="status" aria-live="polite"></span>

                <button type="button" class="botao botao-texto" data-mostrar-senha="senha">
                    Mostrar senha
                </button>
                <span class="aviso-campo" data-erro="senha" hidden></span>
            </div>

            <button type="submit" class="botao botao-acao botao-largo">Criar minha conta</button>
        </form>

        <p class="centro" style="margin-top:var(--e3)">
            Já tem conta? <a href="login.html">Entrar</a>
        </p>
    </div>
</main>

<script src="../src/js/utils/format.js"></script>
<script src="../src/js/utils/sessao.js"></script>
<script src="../src/js/components/icones.js"></script>
<script src="../src/js/components/navegacao.js"></script>
<script src="../src/js/components/carregando.js"></script>
<script src="../src/js/components/avisos.js"></script>
<script src="../src/js/components/senha.js"></script>
<script src="../src/js/api/cliente.js"></script>
<script src="../src/js/api/auth.js"></script>
<script src="../src/js/i18n/pt.js"></script>
<script src="../src/js/i18n/en.js"></script>
<script src="../src/js/i18n/es.js"></script>
<script src="../src/js/i18n/idioma.js"></script>
<script src="../src/js/paginas/cadastro.js"></script>
</body>
</html>
