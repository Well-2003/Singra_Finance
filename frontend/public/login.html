<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F6F1E7">
    <meta name="description" content="Entre na sua conta do Singra.">
    <title>Entrar - Singra</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../src/css/global.css">
</head>
<body data-area="site" data-pagina="login">
<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<main id="conteudo" class="tela-centro">
    <div class="cartao cartao-entrada">
        <div class="centro">
            <a class="marca" href="index.html" data-marca></a>
            <h1 style="margin-top:var(--e2)">Que bom te ver de novo</h1>
        </div>

        <!-- Erro de login é geral de propósito: a mensagem não diz qual dos
             dois campos falhou, para não revelar quem tem conta no site -->
        <p class="aviso aviso-problema" data-erro-geral role="alert" hidden></p>

        <form data-form-login novalidate>
            <div class="campo">
                <label for="email">Seu e-mail</label>
                <input type="email" id="email" name="email" autocomplete="email"
                       required autofocus>
            </div>

            <div class="campo">
                <label for="senha">Sua senha</label>
                <input type="password" id="senha" name="senha"
                       autocomplete="current-password" required>
                <button type="button" class="botao botao-texto" data-mostrar-senha="senha">
                    Mostrar senha
                </button>
            </div>

            <label class="marcar">
                <input type="checkbox" name="manter" checked>
                Manter conectado neste aparelho
            </label>

            <button type="submit" class="botao botao-acao botao-largo"
                    style="margin-top:var(--e2)">Entrar</button>
        </form>

        <!-- Conta de vitrine: quem quiser conhecer o Singra entra e vê o
             sistema cheio, sem precisar criar conta nem esperar dados -->
        <div class="acesso-demo">
            <span class="acesso-demo-titulo">Quer só dar uma olhada?</span>
            <span class="acesso-demo-dados">demo@singra.com.br &middot; singra1234</span>
            <button type="button" class="botao botao-suave botao-largo" data-entrar-demo>
                Entrar como demonstração
            </button>
        </div>

        <div class="centro" style="margin-top:var(--e3)">
            <p><a href="recuperar-senha.html">Esqueci minha senha</a></p>
            <p>Ainda não tem conta? <a href="cadastro.html">Criar conta grátis</a></p>
        </div>
    </div>
</main>

<script src="../src/js/utils/format.js"></script>
<script src="../src/js/utils/sessao.js"></script>
<script src="../src/js/components/icones.js"></script>
<script src="../src/js/components/navegacao.js"></script>
<script src="../src/js/components/carregando.js"></script>
<script src="../src/js/components/avisos.js"></script>
<script src="../src/js/components/senha.js"></script>
<script src="../src/js/api/cliente.js"></script>
<script src="../src/js/api/auth.js"></script>
<script src="../src/js/i18n/pt.js"></script>
<script src="../src/js/i18n/en.js"></script>
<script src="../src/js/i18n/es.js"></script>
<script src="../src/js/i18n/idioma.js"></script>
<script src="../src/js/paginas/login.js"></script>
</body>
</html>
