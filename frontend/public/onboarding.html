<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F6F1E7">
    <meta name="description" content="Configure o básico do seu Singra.">
    <title>Primeiros passos - Singra</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../src/css/global.css">
    <link rel="stylesheet" href="../src/css/dashboard.css">
</head>
<body data-area="sistema" data-pagina="onboarding">
<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<!-- Sem menu nem barra inferior: são seis perguntas rápidas, e sair do
     caminho no meio delas só atrapalharia. A saída fica no fim da tela. -->
<main id="conteudo" class="tela-foco">
    <a class="marca" href="dashboard.html" data-marca></a>

    <!-- As marcas de progresso e as perguntas são montadas pelo
         onboarding.js: o número de passos muda conforme as respostas -->
    <div class="passos" style="margin-top:var(--e3)" aria-hidden="true"
         data-passos></div>
    <p class="legenda" data-contador aria-live="polite">Passo 1 de 6</p>

    <div data-conteudo style="margin-top:var(--e2)">
        <span class="esqueleto esqueleto-linha"></span>
        <span class="esqueleto esqueleto-bloco"></span>
    </div>
</main>

<script src="../src/js/utils/format.js"></script>
<script src="../src/js/utils/sessao.js"></script>
<script src="../src/js/components/icones.js"></script>
<script src="../src/js/components/navegacao.js"></script>
<script src="../src/js/components/carregando.js"></script>
<script src="../src/js/components/avisos.js"></script>
<script src="../src/js/api/cliente.js"></script>
<script src="../src/js/api/auth.js"></script>
<script src="../src/js/api/perfil.js"></script>
<script src="../src/js/i18n/pt.js"></script>
<script src="../src/js/i18n/en.js"></script>
<script src="../src/js/i18n/es.js"></script>
<script src="../src/js/i18n/idioma.js"></script>
<script src="../src/js/paginas/onboarding.js"></script>
</body>
</html>
